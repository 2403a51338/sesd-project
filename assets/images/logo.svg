<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="neonLogo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Mini badges: Rock, Paper, Scissors -->
  <circle cx="20" cy="30" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="20" y="36" font-size="14" text-anchor="middle" fill="#38bdf8">✊</text>
  <circle cx="44" cy="30" r="14" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="44" y="36" font-size="14" text-anchor="middle" fill="#a855f7">✋</text>
  <circle cx="68" cy="30" r="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="68" y="36" font-size="14" text-anchor="middle" fill="#2dd4bf">✌️</text>
  <!-- Title text -->
  <text x="92" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="url(#neonLogo)" letter-spacing="1.5">RPS ARENA</text>
  <text x="92" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#94a3b8" letter-spacing="2">TOURNAMENT</text>
</svg>
