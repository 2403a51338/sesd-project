<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rookieHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background circle badge -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Antenna -->
  <line x1="50" y1="26" x2="50" y2="16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="14" r="4" fill="#38bdf8"/>
  <!-- Head -->
  <rect x="25" y="26" width="50" height="42" rx="10" fill="url(#rookieHead)"/>
  <!-- Screen/Face visor -->
  <rect x="31" y="34" width="38" height="24" rx="6" fill="#090d16"/>
  <!-- Cute friendly eyes -->
  <circle cx="41" cy="45" r="4.5" fill="#38bdf8"/>
