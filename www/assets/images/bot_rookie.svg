  <path d="M44 52 Q50 56 56 52" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Ears / Bolts -->
  <rect x="20" y="40" width="5" height="14" rx="2" fill="#38bdf8"/>
  <rect x="75" y="40" width="5" height="14" rx="2" fill="#38bdf8"/>
